<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f4f6">
  <meta name="description" content="I'm Still Not a Robot: an increasingly absurd series of CAPTCHA challenges.">
  <title>I'm Still Not a Robot</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect x='6' y='10' width='28' height='22' rx='6' fill='%234a7fd8'/%3E%3Ccircle cx='14' cy='20' r='3' fill='%23fff'/%3E%3Ccircle cx='26' cy='20' r='3' fill='%23fff'/%3E%3Ccircle cx='20' cy='5' r='3' fill='%23f2b632'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body class="tone-0">
  <header class="topbar">
    <div class="brand">I'm Still Not a Robot</div>
    <div class="top-controls">
      <span id="timer" class="timer" title="Run timer" aria-label="Run timer">00:00</span>
      <button id="btn-mute" class="icon-btn" type="button" aria-label="Mute sound">🔊</button>
      <button id="btn-menu" class="icon-btn" type="button" aria-label="Open menu">☰</button>
    </div>
  </header>

  <main id="stage">
    <section class="hud" aria-label="Progress">
      <div class="hud-row">
        <span id="level-label">Level 1</span>
        <span id="act-label"></span>
      </div>
      <div class="progress"><div id="progress-fill"></div></div>
      <div class="suspicion" role="meter" aria-valuemin="0" aria-valuemax="100">
        <span class="sus-title">🤖 <span class="sus-robot">Robot </span>suspicion</span>
        <div class="sus-bar"><div id="sus-fill"></div></div>
        <span id="sus-label">Low</span>
      </div>
    </section>

    <div id="widget-slot"></div>
    <div id="result" aria-live="polite"></div>
    <p id="flavor" class="flavor" aria-live="polite"></p>

    <div class="hint-row">
      <button id="hint-btn" class="btn-ghost" type="button" disabled>💡 Hint</button>
      <p id="hint-text" class="hint-text" hidden></p>
    </div>
  </main>

  <footer class="page-foot">
    <a href="#" data-link="privacy">Privacy</a> ·
    <a href="#" data-link="terms">Terms</a> ·
    <a href="#" data-link="help">Help</a>
    <div class="fineprint">A fan-made CAPTCHA parody. No robots were verified in the making of this game.</div>
  </footer>

  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>

  <!-- Classic scripts (not modules) so the game runs straight from file:// -->
  <script src="assets/art.js"></script>
  <script src="challenges/util.js"></script>
  <script src="challenges/checkbox.js"></script>
  <script src="challenges/grid.js"></script>
  <script src="challenges/text.js"></script>
  <script src="challenges/slider.js"></script>
  <script src="challenges/audio.js"></script>
  <script src="challenges/drag.js"></script>
  <script src="levels.js"></script>
  <script src="main.js"></script>
</body>
</html>
